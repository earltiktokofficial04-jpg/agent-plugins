name: osint
permissions: read-all

on:
  pull_request:
    paths:
      - 'osint/**'
      - '.github/workflows/osint.yaml'
  # Deliberately not limited to main: the point is that every push builds,
  # including work in progress on a feature branch.
  push:
    paths:
      - 'osint/**'
      - '.github/workflows/osint.yaml'
  # The OSINT engine talks to a dozen third-party services whose response
  # shapes change without notice. The suites are fully mocked so this run
  # proves the code, not the services — but a weekly run still catches
  # toolchain drift early.
  schedule:
    - cron: '0 0 * * 0' # weekly
  workflow_dispatch:

jobs:
  # osint_core is pure Dart with no Flutter dependency, which is the whole
  # point of the split: it can be analyzed, tested and measured for coverage
  # with the Dart SDK alone, on every platform.
  core:
    name: osint_core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: osint/osint_core
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - run: dart format --output=none --set-exit-if-changed .

      # Every test uses MockClient, so the suite never touches the network
      # and cannot be made flaky by a third party being down.
      - run: dart test

  core_coverage:
    name: osint_core coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osint/osint_core
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: Collect coverage
        run: dart test --coverage=coverage

      - name: Format coverage to LCOV
        run: >-
          dart run coverage:format_coverage --lcov --in=coverage
          --out=coverage/lcov.info --report-on=lib

      # Action steps do not inherit defaults.run.working-directory, so this
      # path is relative to the repository root. The gate sits below the
      # current figure so it catches a real regression without failing on
      # ordinary churn.
      - name: Enforce coverage threshold
        uses: VeryGoodOpenSource/very_good_coverage@c953fca3e24a915e111cc6f55f03f756dcb3964c # v3
        with:
          path: osint/osint_core/coverage/lcov.info
          min_coverage: 85

  app:
    name: osint_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osint/osint_app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --fatal-infos

      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter test

  # Proving the Dart analyses and passes its tests says nothing about whether
  # the Android half actually assembles — Gradle, the manifest, the plugin
  # native code and R8 are all outside what `flutter test` touches.
  build_apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: [core, app]
    defaults:
      run:
        working-directory: osint/osint_app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Without this, Gradle re-downloads the Android toolchain and every
          # dependency on each run — several minutes and a couple of GB.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Split per ABI. A universal APK carrying the ML Kit OCR and barcode
      # models for every architecture comes to ~96MB; per-ABI builds are about
      # a third of that, and a device only ever needs one.
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Report APK sizes
        run: ls -lh build/app/outputs/apk/release/*.apk

      # Uploaded from Gradle's own output directory rather than Flutter's
      # flutter-apk/ copy. Flutter copies the artifacts across while dropping
      # the "-unsigned" suffix, so the copies are named as though they were
      # signed when they are not — verified: apksigner reports DOES NOT VERIFY
      # on both. Shipping a file whose name lies about its signing state is
      # how an unsigned build reaches a device and fails to install.
      #
      # No signing key is configured on purpose: nothing secret has to live in
      # the repository or in Actions, and whoever releases signs the artifact
      # themselves. See osint/RELEASING.md. Dropping an android/key.properties
      # in makes this same job emit signed APKs instead.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: osint-app-release-apks
          path: osint/osint_app/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
